camera:
  device_id: 0
  width: 1280
  height: 720
  fps: 30
  reconnect_timeout_sec: 2.0

tracker:
  model_path: "models/hand_landmarker.task"
  running_mode: "video"   # "video" for ultra-fast temporal tracking, "image" for single-frame
  max_num_hands: 1
  min_detection_confidence: 0.65
  min_presence_confidence: 0.55
  min_tracking_confidence: 0.55
  box_padding: 20
  enable_clahe: true      # Contrast-Limited Adaptive Histogram Equalization for low-light & backlit rooms
  clahe_clip_limit: 2.0

filter:
  type: "one_euro"         # "one_euro" (adaptive speed-based smoothing) or "ema"
  min_cutoff: 1.0          # Minimum cutoff frequency (Hz) - lower = heavier smoothing when still
  beta: 0.007              # Speed coefficient - higher = less lag during rapid hand movements
  d_cutoff: 1.0            # Cutoff for derivative estimation (Hz)
  smoothing_alpha: 0.60    # EMA fallback parameter if filter type is set to "ema"
  enable_smoothing: true
  enable_trajectory: true  # Dynamic stroke tracking for J and Z signs

debouncer:
  consecutive_frames: 3    # Fast 3-frame lock-on (~100ms at 30fps)
  history_length: 8        # Efficient history window

visualizer:
  mirror: true
  draw_landmarks: true
  show_fps: true
  show_bounding_box: true
  box_padding: 20

classifier:
  mode: "hybrid"           # "hybrid" (heuristic + ML fallback), "heuristic", or "ml"
  model_path: "models/lightgbm_classifier.pkl" # LightGBM gradient-boosted decision forest
  min_confidence: 0.70
  ml_fallback_min_confidence: 0.75
  enable_lstm: true        # LSTMR Recurrent Sequence Recognizer for dynamic motions
  lstm_model_path: "models/lstm_gesture_model.npz"

speller:
  enable_tts: true         # Speak completed words aloud on [SPACE]
  enable_autocomplete: true # Word suggestion HUD & [TAB] completion

heuristics:
  min_hand_span: 0.05
  canonical_alignment: true # 3D rotation-invariant canonical coordinate mapping
  o_thumb_index_dist: 0.36
  o_thumb_middle_dist: 0.36
  o_thumb_ring_dist: 0.38
  o_thumb_pinky_dist: 0.45
  o_mcp5_wrist_dist: 0.65
  q_thumb_index_dist: 0.40
  q_index_down_offset: 0.18
  u_v_spread_ratio: 1.25
  k_thumb_proximity: 0.45
  l_thumb_horizontal_ratio: 0.85
  fist_m_transverse: 0.52
  fist_n_transverse: 0.35
  fist_e_thumb_height: 0.02
  b_finger_dist_im: 0.42
  b_finger_dist_mr: 0.42
  b_finger_dist_rp: 0.58
