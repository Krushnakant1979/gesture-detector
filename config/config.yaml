camera:
  device_id: 0
  width: 1280
  height: 720
  fps: 30

tracker:
  model_path: "models/hand_landmarker.task"
  max_num_hands: 1
  min_detection_confidence: 0.65
  min_presence_confidence: 0.55
  min_tracking_confidence: 0.55
  box_padding: 20

debouncer:
  consecutive_frames: 4   # Fast 4-frame response
  history_length: 8

visualizer:
  mirror: true
  draw_landmarks: true
  show_fps: true
  show_bounding_box: true
  box_padding: 20

classifier:
  mode: "heuristic"  # Use precision biomechanical rules
  model_path: "models/gesture_classifier.pkl"
  min_confidence: 0.70
